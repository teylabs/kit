          composer test:workbench
          composer test:workbench-js
      - name: Workbench item parity (PHP, TypeScript, MCP)
        timeout-minutes: 4
        run: composer test:workbench-item-parity
      - name: Every test script runs in CI
        run: php bin/ci-scripts-check.php
