name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  privacy:
    name: Privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh bin/privacy-check.sh
        env:
          PRIVACY_PATTERN: ${{ secrets.PRIVACY_PATTERN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: tests (${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - name: Catalog pins
        run: php bin/catalog-pins.php --check
      - name: Show installed Mod
        run: |
          composer show tey/mod | grep -E '^versions : \* v0\.11\.'
      - name: Scaffold checks
        run: |
          composer test:scaffold
          for release in A B C D; do php tests/ScaffoldCheck.php vendor/autoload.php "$release"; done
          php tests/ScaffoldCheck.php vendor/autoload.php C misplace-defaults
          php tests/ScaffoldCheck.php vendor/autoload.php features:foundation
          php tests/ScaffoldCheck.php vendor/autoload.php features:foundation,defaults
          php tests/ScaffoldCheck.php vendor/autoload.php features:foundation,defaults misplace-defaults
      - name: Feature manifests and selections
        run: composer test:features
      - name: Feature catalogs and stub trees
        run: composer test:catalog
      - name: Lifecycle on released Mod
        run: composer test:lifecycle
      - name: Read-only installed status
        run: composer test:status
      - name: Resource tamper checks
        run: composer test:resources
      - name: Starter feature library
        run: composer test:library
      - name: Explanation TypeScript mapping
        run: composer test:typescript
      - name: Starter catalog
        run: composer test:starter-catalog
      - name: Shell feature
        run: composer test:shell
      - name: Per-feature lineages and kit:add
        run: composer test:adopt
      - name: Host steps and requirements in plans
        run: composer test:plan-steps
      - name: Adopt in place (pre-lifecycle apps)
        run: composer test:adopt-in-place
      - name: kit:install on a fresh app
        run: composer test:install
      - name: Font sets
        run: composer test:fonts
      - name: Fluent mail
        run: composer test:mail
      - name: Brand variants
        run: composer test:brand
      - name: Environment indicator
        run: composer test:environment
      - name: Permissions
        run: composer test:permissions
      - name: Permissions over HTTP
        run: composer test:permissions-http
      - name: Workspace guard
        run: composer test:workspace-guard
      - name: Capability guard
        run: composer test:capability-guard
      - name: Capability tools
        run: composer test:capability-tool
      - name: Entitlements
        run: composer test:entitlements
      - name: MCP refresh
        run: composer test:mcp-refresh
      - name: MCP consent
        run: composer test:mcp-consent
      - name: Dashboard greeting
        run: composer test:greeting
      - name: Toasts
        run: composer test:toast
      - name: Tables
        run: composer test:tables
      - name: Scroll lists
        run: composer test:lists
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: TypeScript stubs parse
        run: composer test:stubs
      - name: Table count line
        run: composer test:table-count
      - name: Popover helpers
        run: composer test:popover
      - name: Explanation
        run: composer test:explanation
      - name: InputSelect
        run: composer test:input-select
      - name: JS helpers
        run: composer test:js
      - name: Split drop
        run: composer test:split-drop
      - name: Every test script runs in CI
        run: php bin/ci-scripts-check.php
