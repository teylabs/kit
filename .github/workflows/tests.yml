name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  privacy:
    name: Privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh bin/privacy-check.sh
        env:
          PRIVACY_PATTERN: ${{ secrets.PRIVACY_PATTERN }}

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: tests (${{ matrix.php }})
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php: ${{ matrix.php }}
          coverage: none
      - run: composer update --prefer-dist --no-interaction --no-progress
      - name: Show installed Mod
        run: |
          composer show tey/mod | grep -E '^versions : \* v0\.9\.'
      - name: Scaffold checks
        run: |
          composer test:scaffold
          for release in A B C D; do php tests/ScaffoldCheck.php vendor/autoload.php "$release"; done
          php tests/ScaffoldCheck.php vendor/autoload.php C misplace-defaults
          php tests/ScaffoldCheck.php vendor/autoload.php features:foundation
          php tests/ScaffoldCheck.php vendor/autoload.php features:foundation,defaults
          php tests/ScaffoldCheck.php vendor/autoload.php features:foundation,defaults misplace-defaults
      - name: Feature manifests and selections
        run: composer test:features
      - name: Feature catalogs and stub trees
        run: composer test:catalog
      - name: Lifecycle on released Mod
        run: composer test:lifecycle
      - name: Read-only installed status
        run: composer test:status
      - name: Resource tamper checks
        run: composer test:resources
      - name: Starter feature library
        run: composer test:library
      - name: Starter catalog
        run: composer test:starter-catalog
      - name: Per-feature lineages and kit:add
        run: composer test:adopt
      - name: kit:install on a fresh app
        run: composer test:install
      - name: Font sets
        run: composer test:fonts
      - name: Brand variants
        run: composer test:brand
      - name: Permissions
        run: composer test:permissions
      - name: Permissions over HTTP
        run: composer test:permissions-http
      - name: Workspace guard
        run: composer test:workspace-guard
      - name: Capability guard
        run: composer test:capability-guard
      - name: Entitlements
        run: composer test:entitlements
